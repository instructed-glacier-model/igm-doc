# Module I/O declarations — single source of truth for state variable reads/writes.
# Generated from source audit of igm/processes/<name>/<name>.py
#
# "needs"   = state variables read in initialize() / update()
# "updates" = state variables written in initialize() / update()
# "community: true" marks community (non-core) modules
# "category" maps to Earth component groups defined in module_categories.yaml

# ── Core modules ──────────────────────────────────────────────────────────────

time:
  category: cryosphere
  needs:   [ubar, vbar]
  updates: [t, dt]

iceflow:
  category: cryosphere
  needs:   [thk, usurf, topg, arrhenius, slidingco]
  updates: [U, V, ubar, vbar]

thk:
  category: cryosphere
  needs:   [thk, topg, ubar, vbar, smb, dt]
  updates: [thk, usurf, divflux]

vert_flow:
  category: cryosphere
  needs:   [U, V, thk]
  updates: [W, wvelbase, wvelsurf]

smb_simple:
  category: atmosphere
  needs:   [usurf, icemask]
  updates: [smb]

enthalpy:
  category: cryosphere
  needs:   [thk, U, V, W, arrhenius]
  updates: [E, T, omega, basal_melt_rate, arrhenius]

