site_name: Instructed Glacier Model (IGM)
site_url: https://igm-model.org
site_description: >-
  A differentiable, modular, and GPU-accelerated ice flow model.

# Repository
repo_name: instructed-glacier-model/igm
repo_url: https://github.com/instructed-glacier-model/igm

nav:
  - Home: index.md
  - Installation:
      - Quick Start: installation/quick_start.md
      - Guides:
        - Nvidia Drivers: installation/other/nvidia_drivers.md
        - Virtual Environments: installation/other/virtual_environment.md
        - WSL (Windows): installation/other/wsl_windows.md
  - Getting Started:
      - Overview: getting_started.md
      - Tutorials:
          - tutorials/index.md
          - "Aletsch: forward run": tutorials/aletsch.md
          - "Aletsch: ensemble run": tutorials/aletsch_ensemble.md
          - "Aletsch: particle tracking": tutorials/aletsch_particles.md
          - "Aletsch: parameter calibration": tutorials/aletsch_da.md
      - Best Practices:
          - best_practices/index.md
          - Checklist: best_practices/checklist.md
          - Numerical Tips: best_practices/numerical_tips.md
      - FAQ: best_practices/faq.md
  - Configuration:
      - configuration.md
      - Hydra:
          - hydra/introduction.md
          - Basics: hydra/basics.md
          - Working Directory: hydra/working_directory.md
          - Custom Configurations: hydra/custom_configurations.md
          - Parameter Sweeps: hydra/distributed_computing.md
          - Help: hydra/help.md
      - Optuna:
          - Optimization: hydra/optuna_cluster.md
      - IGM v2 → v3 Transition: about/transition-IGM-2-to-3.md
      - IGM v3.1 → v3.2 Transition: about/transition-IGM-3.1-to-3.2.md
  - Modules:
      - Overview: modules/introduction.md
      - Input Modules:
          - local: modules/inputs/local.md
          - load_ncdf: modules/inputs/load_ncdf.md
          - load_tif: modules/inputs/load_tif.md
          - oggm_shop: modules/inputs/oggm_shop.md
      - Process Modules:
          - Time:
              - time: modules/processes/time.md
          - Atmosphere:
              - climate: modules/processes/climate.md
              - smb: modules/processes/smb.md
          - Cryosphere:
              - arrhenius: modules/processes/arrhenius.md
              - iceflow: modules/processes/iceflow.md
              - thk: modules/processes/thk.md
              - enthalpy: modules/processes/enthalpy.md
          - Lithosphere:
              - subglacial_hydrology: modules/processes/subglacial_hydrology.md
          - Hydrosphere:
              - calving_rate: modules/processes/calving_rate.md
          - Misc:
              - particles: modules/processes/particles.md
      - Assimilation Modules:
          - pretraining: modules/assimilations/pretraining.md
          - field_inversion: modules/assimilations/field_inversion.md
          - time_relaxation: modules/assimilations/time_relaxation.md
      - Output Modules:
          - local: modules/outputs/local.md
          - write_ncdf: modules/outputs/write_ncdf.md
          - write_vtp: modules/outputs/write_vtp.md
          - write_tif: modules/outputs/write_tif.md
          - write_ts: modules/outputs/write_ts.md
          - plot2d: modules/outputs/plot2d.md
          - live_dashboard: modules/outputs/live_dashboard.md
      - Community Modules:
          - Atmosphere:
              - clim_glacialindex: modules/processes/clim_glacialindex.md
              - clim_oggm: modules/processes/clim_oggm.md
              - clim_station: modules/processes/clim_station.md
              - smb_simple: modules/processes/smb_simple.md
              - smb_accpdd: modules/processes/smb_accpdd.md
              - smb_oggm: modules/processes/smb_oggm.md
          - Cryosphere:
              - avalanche: modules/processes/avalanche.md
              - stress: modules/processes/stress.md
          - Lithosphere:
              - gflex: modules/processes/gflex.md
              - glerosion: modules/processes/glerosion.md
              - rockflow: modules/processes/rockflow.md
          - Hydrosphere:
              - flow_accumulation: modules/processes/flow_accumulation.md
          - Misc:
              - data_assimilation: modules/processes/data_assimilation.md
              - read_output: modules/processes/read_output.md
              - texture: modules/processes/texture.md
      - User Modules: modules/user_modules.md
      - Core Parameters: modules/core.md
      - State Variables:
          - modules/state_variables.md
          - IGM Names: modules/variables/igm.md
          - PISM Aliases: modules/variables/pism.md
          - Descriptive Aliases: modules/variables/descriptive.md
  - Developer:
      - developer/index.md
      - State Variable Aliases: developer/aliases.md
      - Module System: developer/module_system.md
      - Diagnostics: developer/diagnostics.md
  - Gallery: gallery/index.md
  - About:
      - Authors: about/credits_and_references.md
      - Citing IGM: about/cite.md
      - Support: about/help.md

hooks:
  - hooks.py

plugins:
  - search
  - include-markdown
  - macros:
      module_name: main
  - table-reader
  - bibtex:
      bib_file: refs.bib
      csl_file: apa.csl

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

theme:
  name: material
  custom_dir: docs/material/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  palette:
    - scheme: glacier_light
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: glacier_dark
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Inter
    code: Fira Code

  language: en
  features:
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link

    - navigation.indexes
    - navigation.path
    - navigation.instant.progress
    - navigation.tabs
    - navigation.footer

    - toc.integrate
    - toc.follow
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/extra.css
  - stylesheets/type-colors.css
  - stylesheets/param-tables.css
  - stylesheets/style.css
  - stylesheets/refs.css
  - stylesheets/gallery.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-AMS_CHTML
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/cite-linkify.js

extra:
  version:
    provider: mike
